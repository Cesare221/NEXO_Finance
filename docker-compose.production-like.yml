services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: nexo_dev_password
      POSTGRES_DB: nexo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexo"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    build:
      context: apps/api
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql://nexo:nexo_dev_password@postgres:5432/nexo
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://nexo:nexo_dev_password@postgres:5432/nexo
      SECRET_KEY: dev-secret-key-at-least-64-characters-long-for-local-rehearsal-only-12345
      ALLOWED_ORIGINS: http://localhost:3011
      ALLOWED_HOSTS: localhost,127.0.0.1
      REDIS_URL: redis://redis:6379/0
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      MAIL_PROVIDER: console
      PUBLIC_WEB_URL: http://localhost:3011
      MFA_ENCRYPTION_KEYS: v1:8pQ1hGvYzFaK9bCdEfGhIjKlMnOpQrStUvWxYz01234=
      MFA_ACTIVE_KEY_VERSION: v1
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('PORT', '8000') + '/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
      args:
        NEXT_STANDALONE: "true"
    ports:
      - "3011:3000"
    environment:
      API_URL: http://localhost:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
