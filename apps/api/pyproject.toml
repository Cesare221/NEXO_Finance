[project]
name = "fin-api"
version = "0.1.0"
description = "Fin - Personal Finance Assistant API"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg2-binary>=2.9",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "email-validator>=2.2",
    "PyJWT>=2.10",
    "passlib[bcrypt]>=1.7",
    "python-multipart>=0.0.18",
    "argon2-cffi>=23.1",
    "httpx>=0.28",
    "redis>=5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pip-audit>=2.9",
]
