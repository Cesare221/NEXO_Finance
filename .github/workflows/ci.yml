name: CI

on:
  pull_request:
    branches: [main, codex/*]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexo_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: nexo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql://nexo_test:test_password@localhost:5432/nexo_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key-for-migration-check-only-at-least-64-chars-long!!
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - name: Run migrations
        run: uv run alembic upgrade head
      - name: Check single migration head
        run: python ../../scripts/check-migration-head.py
      - name: Run scrubber-focused tests
        run: uv run pytest tests/test_observability.py -v -q
      - name: Run full API suite
        run: uv run pytest -q
      - name: Verify observability is optional (no DSN)
        run: uv run python -c "from app.core.observability import init_observability; init_observability(); print('OK')"
      - name: pip audit
        run: uv run pip-audit --progress-spinner off
        continue-on-error: true

  web-build:
    name: Web Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Smoke tests
        run: node tests/smoke.mjs
      - name: npm audit
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Build with DSNs unset (observability optional)
        run: npm run build
        env:
          NEXT_PUBLIC_SENTRY_DSN: ""

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t nexo-api:ci apps/api
      - name: Build Web image
        run: docker build --build-arg NEXT_STANDALONE=true -t nexo-web:ci apps/web

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for leaked secrets
        run: ./scripts/check-secrets.ps1
        shell: pwsh
