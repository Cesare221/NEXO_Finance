name: Deploy to Vercel and Railway

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options:
          - staging
          - production
        required: true
        description: Target environment
      git_sha:
        type: string
        required: true
        description: Git SHA to deploy

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: apps/api/requirements.lock

      - name: Install uv
        run: pip install uv

      - name: Run CI validation (API)
        working-directory: apps/api
        run: |
          uv sync --locked --extra dev
          uv run python -m pytest -q
          uv run python -m pip_audit -r requirements.lock

      - name: Run CI validation (Web)
        working-directory: apps/web
        run: |
          npm ci
          npx tsc --noEmit
          npm test
          npm audit --audit-level=high
          npm run build

      - name: Deploy API to Railway
        run: |
          npx @railway/cli up --service "${{ secrets.RAILWAY_SERVICE_ID }}" --environment "${{ secrets.RAILWAY_ENVIRONMENT_ID }}" --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Wait for API readiness
        run: |
          for i in {1..30}; do
            if curl -sf "${{ vars.API_URL }}/ready" | grep -q '"status":"ready"'; then
              echo "API is ready"
              exit 0
            fi
            echo "Waiting for API... ($i/30)"
            sleep 10
          done
          echo "API readiness timeout"
          exit 1

      - name: Pull Vercel environment
        working-directory: apps/web
        run: |
          npx vercel pull --yes --environment="${{ inputs.environment == 'production' && 'production' || 'preview' }}" --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build Vercel (production)
        if: inputs.environment == 'production'
        working-directory: apps/web
        run: npx vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build Vercel (staging)
        if: inputs.environment == 'staging'
        working-directory: apps/web
        run: npx vercel build --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy Vercel (production)
        if: inputs.environment == 'production'
        working-directory: apps/web
        run: npx vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy Vercel (staging)
        if: inputs.environment == 'staging'
        working-directory: apps/web
        run: npx vercel deploy --prebuilt --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Run production smoke tests
        working-directory: apps/api
        run: |
          python scripts/smoke_production.py \
            --web-url "${{ vars.WEB_URL }}" \
            --api-url "${{ vars.API_URL }}" \
            --email "${{ secrets.SMOKE_EMAIL }}" \
            --password "${{ secrets.SMOKE_PASSWORD }}" \
            --totp-secret "${{ secrets.SMOKE_TOTP_SECRET }}"
        env:
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
          SMOKE_TOTP_SECRET: ${{ secrets.SMOKE_TOTP_SECRET }}

      - name: Record deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Git SHA**: ${{ inputs.git_sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **API URL**: ${{ vars.API_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Web URL**: ${{ vars.WEB_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed at**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY